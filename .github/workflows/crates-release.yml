name: crates release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package crates without publishing"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo package -p cmls-nimbus
      - run: cargo package -p cmls-knowledge-core
      - name: Package CLI crate dry-run
        if: ${{ inputs.dry_run == 'true' }}
        run: cargo package -p cmls-knowledge-cli --config 'patch.crates-io.cmls-knowledge-core.path="crates/cumulus-knowledge-core"'
      - name: cargo publish
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          cargo publish -p cmls-nimbus
          cargo publish -p cmls-knowledge-core
          for attempt in $(seq 1 30); do
            if cargo search cmls-knowledge-core --limit 1 | grep -q '^cmls-knowledge-core = '; then
              break
            fi
            sleep 10
          done
          cargo package -p cmls-knowledge-cli
          cargo publish -p cmls-knowledge-cli
