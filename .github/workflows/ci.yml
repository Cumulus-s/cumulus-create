name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "request/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: npm ci
      - run: python -m pip install pytest
      - run: npm run typecheck
      - run: npm run packages:build
      - run: npm run test
      - run: PYTHONPATH=python python -m pytest python/tests
      - run: PYTHONPATH=packages/altocumulus/python python -m pytest packages/altocumulus/python/tests
      - run: npm run web:build
      - run: npm run license:check
      - run: npm run security:scan
      - run: npm run release:pack
      - run: npm --workspace @cumulus/database run test:postgres
        env:
          CUMULUS_DB_POSTGRES_TESTS: "true"
      - run: cargo package -p cumulus-nimbus --allow-dirty
