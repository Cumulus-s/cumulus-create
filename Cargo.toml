[workspace]
resolver = "2"
members = [
  "crates/cumulus-knowledge-core",
  "crates/cumulus-knowledge-cli",
  "crates/nimbus"
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
version = "0.1.0"
authors = ["Cumulus Create contributors"]
description = "Centralized Cumulus Create auth, database, knowledge, CLI, TUI, MCP, and bootstrap runtime"
repository = "https://github.com/Cumulus-s/cumulus-create"
homepage = "https://cumulush.com"
keywords = ["cumulus", "knowledge-graph", "mcp", "cli", "agents"]
categories = ["command-line-utilities", "text-processing"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ignore = "0.4"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
walkdir = "2"
